name: tests

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/lint@v2

  test:
    needs: [linting]
    name: ${{ matrix.os }} ${{ matrix.qt-backend }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash {0}

    strategy:
      matrix:
        include:
          # Python version sweep — Linux + pyqt5
          - {os: ubuntu-latest, python-version: "3.10", qt-backend: pyqt5}
          - {os: ubuntu-latest, python-version: "3.11", qt-backend: pyqt5}
          - {os: ubuntu-latest, python-version: "3.12", qt-backend: pyqt5}
          - {os: ubuntu-latest, python-version: "3.13", qt-backend: pyqt5}
          # Qt backend sweep — Linux + py3.12
          - {os: ubuntu-latest, python-version: "3.12", qt-backend: pyqt6}
          - {os: ubuntu-latest, python-version: "3.12", qt-backend: pyside6}
          # OS smoke tests — pyqt5 + py3.12
          - {os: windows-latest, python-version: "3.12", qt-backend: pyqt5}
          - {os: windows-latest, python-version: "3.12", qt-backend: pyside6}
          - {os: macos-latest,   python-version: "3.12", qt-backend: pyqt5}
          - {os: macos-latest,   python-version: "3.12", qt-backend: pyside6}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ubuntu Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0

      - name: Install viewephys from repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev,${{ matrix.qt-backend }}]

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          python -m pytest

